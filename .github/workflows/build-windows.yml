name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Release x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (-not $msbuild) {
            throw 'MSBuild was not found.'
          }
          & $msbuild 'Violations\Violations.vcxproj' /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$env:RUNNER_TEMP/violation-reader/"

      - name: Upload Violations.exe
        uses: actions/upload-artifact@v7
        with:
          name: Violation-Reader-Windows-x64
          path: ${{ runner.temp }}/violation-reader/Violations.exe
          if-no-files-found: error
